spring.application.name=cet-sheet-backend

# -- Render Config --
# Uncomment this block when deploying to Render.
spring.application.name=cet-sheet-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api/v1
server.port=${PORT:8080}
# Required for correct absolute URL generation behind Render/reverse proxies.
server.forward-headers-strategy=framework
app.jwt.secret=${APP_JWT_SECRET}
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
app.cache.sheet-catalog.enabled=true
app.cache.sheet-catalog.key-prefix=sheetCatalog
app.cache.sheet-catalog.version=v1
app.cache.sheet-catalog.warm-on-startup=true

# OAuth2 (Google + GitHub)
# Do NOT hardcode OAuth client credentials in this file.
# Local: set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as environment variables.
# Render: set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Render service Environment settings.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional: enable GitHub OAuth only after setting env vars.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Frontend callback after backend OAuth success.
# Local example:  APP_OAUTH2_REDIRECT_URI=http://localhost:5173/oauth/callback
# Render example: APP_OAUTH2_REDIRECT_URI=https://<your-frontend-domain>/oauth/callback
app.oauth2.authorized-redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

# Comma-separated origin patterns for CORS.
# Include local frontend(s) + production frontend domain(s).
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://cet-sheet-frontend.vercel.app,https://*.vercel.app}

