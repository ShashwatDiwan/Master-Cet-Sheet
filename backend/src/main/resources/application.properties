spring.application.name=cet-sheet-backend

# -- Render Config --
# Uncomment this block when deploying to Render.
# spring.application.name=cet-sheet-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api/v1
server.port=${PORT:8080}
app.jwt.secret=${APP_JWT_SECRET}
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
app.cache.sheet-catalog.enabled=true
app.cache.sheet-catalog.key-prefix=sheetCatalog
app.cache.sheet-catalog.version=v1
app.cache.sheet-catalog.warm-on-startup=true

# OAuth2 (Google + GitHub)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.authorized-redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

