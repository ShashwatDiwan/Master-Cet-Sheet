spring.application.name=cet-sheet-backend

# datasource settings; defaults to local Postgres (update credentials as needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/CetSheet
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.servlet.context-path=/api/v1

# secret must be at least 32 bytes after base64 decode (256 bits) to satisfy JWT HMAC-SHA
# generate with: openssl rand -base64 32  or PowerShell RNGCryptoServiceProvider
app.jwt.secret=ytJVbFXhWfNI8yspCRm3b6cdH0na/XybHKfdawKFc0E=
# override via APP_JWT_SECRET environment variable in prod

spring.flyway.enabled=false
# Flyway is disabled; manage schema manually or use JPA ddl-auto
