spring.application.name=cet-sheet-backend

#-- AI Config --
# Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# -- Render Config --
# Uncomment this block when deploying to Render.
spring.application.name=cet-sheet-backend
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
# Keep update only until the reviewed Flyway V1 baseline has been generated from
# production's schema. The deploy runbook switches these two values to true/validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
server.servlet.context-path=/api/v1
server.port=${PORT:8080}
# Required for correct absolute URL generation behind Render/reverse proxies.
server.forward-headers-strategy=framework

app.jwt.secret=${APP_JWT_SECRET}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
app.cache.sheet-catalog.enabled=true
app.cache.sheet-catalog.key-prefix=sheetCatalog
app.cache.sheet-catalog.version=v1
app.cache.sheet-catalog.warm-on-startup=true

# Supabase Storage is intentionally independent from the application's database host.
app.supabase-storage.url=${SUPABASE_URL:}
app.supabase-storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase-storage.bucket=${SUPABASE_STORAGE_BUCKET:cet-resources}
app.supabase-storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:3600}
app.supabase-storage.max-file-bytes=${SUPABASE_STORAGE_MAX_FILE_BYTES:52428800}

# This one-shot importer is disabled by default. It must be explicitly enabled
# with a reviewed manifest and defaults to dry-run mode.
app.resource-upload.enabled=${RESOURCE_UPLOAD_ENABLED:false}
app.resource-upload.dry-run=${RESOURCE_UPLOAD_DRY_RUN:true}
app.resource-upload.manifest=${RESOURCE_UPLOAD_MANIFEST:}

