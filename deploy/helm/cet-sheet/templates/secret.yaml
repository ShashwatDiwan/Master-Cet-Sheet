apiVersion: v1
kind: Secret
metadata:
  name: cet-sheet-secrets
  labels:
    {{- include "cet-sheet.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | quote }}
  APP_JWT_SECRET: {{ .Values.backend.secrets.appJwtSecret | quote }}
  GEMINI_API_KEY: {{ .Values.backend.secrets.geminiApiKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.backend.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.backend.secrets.googleClientSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.backend.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.backend.secrets.githubClientSecret | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.backend.secrets.supabaseServiceRoleKey | quote }}
