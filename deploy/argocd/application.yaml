apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cet-sheet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-username/cet-sheet-hub-main.git
    targetRevision: main
    path: deploy/helm/cet-sheet
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cet-sheet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
